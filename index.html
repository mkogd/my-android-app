<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Match TV AZ — القنوات الأذربيجانية</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08111f;color:#f4f7fb;font-family:Tahoma,Arial,sans-serif;direction:rtl}
header{background:linear-gradient(180deg,#10243b,#0b1728);padding:24px 16px 20px;text-align:center;border-bottom:1px solid #1d344e}
header h1{margin:0;font-size:25px}.sub{margin-top:7px;color:#91a6bd;font-size:13px}
.wrap{max-width:820px;margin:auto;padding:14px}
.search{display:flex;gap:8px;margin-bottom:12px}.search input{flex:1;background:#101f33;border:1px solid #29415d;border-radius:12px;color:white;padding:13px;font-size:15px;outline:none}
.btn{border:0;border-radius:12px;background:#19a7d8;color:#fff;font-weight:800;padding:12px 15px;cursor:pointer}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs .btn{flex:1;background:#132840}
#status{color:#91a6bd;font-size:13px;margin:8px 3px 12px}
.match-card{background:#101d2e;border:1px solid #203852;border-radius:18px;margin:12px 0;overflow:hidden;box-shadow:0 8px 25px rgba(0,0,0,.16)}
.card-top{display:flex;justify-content:space-between;gap:8px;padding:11px 14px;background:#0d1929;border-bottom:1px solid #1c334b;font-size:12px}
.league{color:#55c6e8;font-weight:800}.date{color:#8297ad}
.match-main{display:grid;grid-template-columns:1fr 100px 1fr;align-items:center;padding:20px 12px 17px;text-align:center;direction:ltr}
.club{direction:rtl;min-width:0}.logo-wrap{height:66px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}.club-logo{width:58px;height:58px;object-fit:contain;display:block}
.club strong{display:block;font-size:15px;white-space:normal;line-height:1.35}.club small{display:block;color:#71869c;font-size:10px;margin-top:4px}
.center{direction:rtl;display:flex;flex-direction:column;align-items:center;gap:5px}.status{font-size:10px;color:#7e93a9;background:#172b40;padding:4px 8px;border-radius:20px}.time{font-size:23px;color:#fff;direction:ltr}.vs{font-size:11px;color:#6e8298}
.card-bottom{padding:10px 14px;border-top:1px solid #1c334b}.channels{display:flex;gap:7px;flex-wrap:wrap}.channel{background:#182b41;border:1px solid #2c4560;padding:7px 10px;border-radius:9px;font-size:12px}.channel.az{border-color:#159cc0;background:#103545}.muted{color:#71869c;font-size:12px}
.empty{text-align:center;padding:45px 15px;color:#8fa5bf;background:#101d2e;border:1px solid #203852;border-radius:18px}.empty-icon{font-size:35px;margin-bottom:8px}.empty b,.empty small{display:block}.empty small{margin-top:6px;color:#71869c}
footer{padding:24px;text-align:center;color:#61768d;font-size:11px}
@media(max-width:520px){header h1{font-size:21px}.match-main{grid-template-columns:1fr 82px 1fr;padding:17px 6px}.club strong{font-size:13px}.club-logo{width:52px;height:52px}.time{font-size:20px}.search{flex-direction:row}.search .btn{padding-inline:13px}}
</style>
</head>
<body>
<header><h1>⚽ Match TV AZ</h1><div class="sub">دليل القنوات الأذربيجانية الناقلة للمباريات 🇦🇿</div></header>
<div class="wrap">
<div class="search"><input id="q" placeholder="ابحث عن ريال مدريد أو برشلونة أو اسم المباراة"><button class="btn" onclick="search()">بحث</button></div>
<div class="tabs"><button class="btn" onclick="today()">مباريات اليوم</button><button class="btn" onclick="az()">İdman TV / CBC Sport</button></div>
<div id="status">اختر بحثًا للبدء.</div><div id="results"></div>
</div>
<footer>نسخة HTML مستقلة. تستخدم API عام لبيانات المباريات. لا تستضيف هذه الصفحة بثًا.</footer>
<script>
const API="https://matchora.to/api/v1";
const $=x=>document.querySelector(x);
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

const AR_CLUBS={
 "real madrid":"ريال مدريد","real madrid cf":"ريال مدريد","fc barcelona":"برشلونة","barcelona":"برشلونة",
 "manchester united":"مانشستر يونايتد","manchester city":"مانشستر سيتي","liverpool":"ليفربول",
 "arsenal":"أرسنال","chelsea":"تشيلسي","tottenham hotspur":"توتنهام","tottenham":"توتنهام",
 "newcastle united":"نيوكاسل يونايتد","aston villa":"أستون فيلا","west ham united":"وست هام يونايتد",
 "brighton":"برايتون","brighton and hove albion":"برايتون","everton":"إيفرتون","fulham":"فولهام",
 "crystal palace":"كريستال بالاس","wolves":"وولفرهامبتون","wolverhampton wanderers":"وولفرهامبتون",
 "nottingham forest":"نوتنغهام فورست","bournemouth":"بورنموث","brentford":"برينتفورد",
 "burnley":"بيرنلي","leeds united":"ليدز يونايتد","sunderland":"سندرلاند",
 "bayern munich":"بايرن ميونخ","bayern münchen":"بايرن ميونخ","borussia dortmund":"بوروسيا دورتموند",
 "bayer leverkusen":"باير ليفركوزن","rb leipzig":"لايبزيغ","eintracht frankfurt":"آينتراخت فرانكفورت",
 "stuttgart":"شتوتغارت","wolfsburg":"فولفسبورغ","freiburg":"فرايبورغ","mainz 05":"ماينتس",
 "paris saint-germain":"باريس سان جيرمان","psg":"باريس سان جيرمان","marseille":"مارسيليا",
 "monaco":"موناكو","lyon":"ليون","lille":"ليل","nice":"نيس","rennes":"رين",
 "inter":"إنتر ميلان","inter milan":"إنتر ميلان","internazionale":"إنتر ميلان",
 "ac milan":"ميلان","milan":"ميلان","juventus":"يوفنتوس","napoli":"نابولي","roma":"روما",
 "lazio":"لاتسيو","atalanta":"أتالانتا","fiorentina":"فيورنتينا","torino":"تورينو",
 "ajax":"أياكس","psv":"آيندهوفن","feyenoord":"فينورد","benfica":"بنفيكا","porto":"بورتو",
 "sporting cp":"سبورتينغ لشبونة","sporting lisbon":"سبورتينغ لشبونة","galatasaray":"غلطة سراي",
 "fenerbahce":"فنربخشة","fenerbahçe":"فنربخشة","besiktas":"بشكتاش","beşiktaş":"بشكتاش",
 "al hilal":"الهلال","al-hilal":"الهلال","al nassr":"النصر","al-nassr":"النصر",
 "al ahly":"الأهلي","al-ahly":"الأهلي","al ain":"العين","al-ain":"العين",
 "flamengo":"فلامنغو","palmeiras":"بالميراس","boca juniors":"بوكا جونيورز","river plate":"ريفر بليت"
};

function arabicClubName(name){
 const raw=String(name||"").trim();
 const key=raw.toLowerCase().replace(/\s+/g," ");
 return AR_CLUBS[key] || raw;
}

function arabicLeagueName(name){
 const raw=String(name||"").trim();
 const key=raw.toLowerCase().replace(/\s+/g," ");
 const leagues={
  "premier league":"الدوري الإنجليزي الممتاز","english premier league":"الدوري الإنجليزي الممتاز",
  "epl":"الدوري الإنجليزي الممتاز","la liga":"الدوري الإسباني","laliga":"الدوري الإسباني",
  "primera division":"الدوري الإسباني","serie a":"الدوري الإيطالي","seriea":"الدوري الإيطالي",
  "bundesliga":"الدوري الألماني","ligue 1":"الدوري الفرنسي","ligue1":"الدوري الفرنسي",
  "uefa champions league":"دوري أبطال أوروبا","champions league":"دوري أبطال أوروبا",
  "uefa europa league":"الدوري الأوروبي","europa league":"الدوري الأوروبي",
  "conference league":"دوري المؤتمر الأوروبي"
 };
 return leagues[key] || raw;
}

function formatKickoff(value){
 if(value===undefined || value===null || value==="") return {date:"",time:""};
 let d;
 const n=Number(value);
 if(Number.isFinite(n)) d=new Date(n < 100000000000 ? n*1000 : n);
 else d=new Date(value);
 if(isNaN(d)) return {date:String(value),time:""};
 return {
   date:new Intl.DateTimeFormat("ar-IQ",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(d),
   time:new Intl.DateTimeFormat("ar-IQ",{hour:"2-digit",minute:"2-digit",hour12:true}).format(d)
 };
}

function arabicClubName(name){
 const raw=String(name||"").trim();
 const key=raw.toLowerCase().replace(/\s+/g," ");
 return AR_CLUBS[key] || raw;
}
function render(events){
 if(!events.length){$("#results").innerHTML='<div class="empty"><div class="empty-icon">⚽</div><b>لا توجد مباريات</b><small>جرّب البحث عن فريق أو بطولة أخرى</small></div>';return}
 $("#results").innerHTML=events.map((e,i)=>{
  const home=e.home||e.home_team||"",away=e.away||e.away_team||"";
  const k=formatKickoff(e.kickoff||e.start_time||e.date);
  const league=arabicLeagueName(e.league||e.tournament||"");
  const chans=(e.channels||[]).map(c=>c.name||c.title).filter(Boolean);
  return `<article class="match-card">
   <div class="card-top">
    <span class="league">${esc(league||"مباراة كرة قدم")}</span>
    <span class="date">${esc(k.date)}</span>
   </div>
   <div class="match-main">
    <div class="club">
      <div class="logo-wrap"><img id="home-${i}" class="club-logo" alt="شعار ${esc(home)}" loading="lazy"></div>
      <strong>${esc(arabicClubName(home))}</strong>
      <small>صاحب الأرض</small>
    </div>
    <div class="center">
      <span class="status">لم تبدأ</span>
      <b class="time">${esc(k.time||"--:--")}</b>
      <span class="vs">VS</span>
    </div>
    <div class="club">
      <div class="logo-wrap"><img id="away-${i}" class="club-logo" alt="شعار ${esc(away)}" loading="lazy"></div>
      <strong>${esc(arabicClubName(away))}</strong>
      <small>الضيف</small>
    </div>
   </div>
   <div class="card-bottom">
    <div class="channels">${chans.length?chans.map(n=>`<span class="channel ${/idman|İdman|cbc sport/i.test(n)?'az':''}">📺 ${esc(n)}</span>`).join(''):'<span class="muted">📺 القنوات: '+esc(e.channel_count||0)+'</span>'}</div>
   </div>
  </article>`
 }).join("");
 events.forEach((e,i)=>{loadBadge(e.home||e.home_team,`home-${i}`);loadBadge(e.away||e.away_team,`away-${i}`);});
}

async function loadBadge(team,id){
 if(!team)return;
 const img=document.getElementById(id);
 if(!img)return;

 const name=normalizeTeamName(team);
 if(logoCache.has(name)){
   const cached=logoCache.get(name);
   if(cached) img.src=cached;
   return;
 }

 // First try Wikipedia's public REST API. It returns the article thumbnail,
 // which for club articles is normally the club crest/logo.
 try{
   const wikiUrl="https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(name);
   const r=await fetch(wikiUrl,{headers:{Accept:"application/json"}});
   if(r.ok){
     const j=await r.json();
     const title=(j.title||"").toLowerCase();
     const description=(j.description||"").toLowerCase();
     const source=j.thumbnail&&j.thumbnail.source;
     const looksLikeClub=/football|soccer|club|fc|cf|afc|sporting/.test(title+" "+description);
     if(source && looksLikeClub){
       logoCache.set(name,source);
       img.src=source;
       img.alt="شعار "+team;
       return;
     }
   }
 }catch(_){}

 // Strict fallback to TheSportsDB: only accept a result whose team name
 // actually matches the requested club, so we never show the wrong badge.
 try{
   const r=await fetch("https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t="+encodeURIComponent(team));
   if(r.ok){
     const j=await r.json();
     const t=j.teams&&j.teams[0];
     const tn=(t&&t.strTeam)||"";
     const same=tn && (tn.toLowerCase()===String(team).toLowerCase() ||
       normalizeTeamName(tn).toLowerCase()===name.toLowerCase());
     const source=t&&(t.strTeamBadge||t.strTeamLogo);
     if(same && source){
       logoCache.set(name,source);
       img.src=source;
       img.alt="شعار "+team;
       return;
     }
   }
 }catch(_){}

 logoCache.set(name,"");
 img.removeAttribute("src");
}
async function get(url){
 $("#status").textContent="جاري جلب البيانات...";
 try{const r=await fetch(url);const j=await r.json();if(!r.ok)throw Error(j.error||"API error");render(j.events||[]);$("#status").textContent=`تم العثور على ${(j.events||[]).length} مباراة`;}
 catch(e){$("#status").textContent="تعذر جلب البيانات: "+e.message;$("#results").innerHTML='<div class="empty">قد يتوقف المصدر العام أو يغيّر API الخاص به. جرّب مرة أخرى.</div>'}
}
function today(){get(API+"/schedule?date="+new Date().toISOString().slice(0,10))}
async function search(){
 const q=$("#q").value.trim().toLowerCase();
 if(!q){today();return}
 $("#status").textContent="جاري البحث...";
 try{
  const r=await fetch(API+"/schedule?watchable=1"); const j=await r.json();
  const all=j.events||[];
  const found=all.filter(e=>`${e.home||""} ${e.away||""} ${e.league||""}`.toLowerCase().includes(q));
  render(found); $("#status").textContent=`تم العثور على ${found.length} مباراة`;
 }catch(e){$("#status").textContent="تعذر جلب البيانات: "+e.message}
}
function az(){get(API+"/channels")}
</script>
</body></html>
